<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/my-style.css">
    <style>
    html, body, #map {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
    }
    </style>
    <title>Access to RIPTA Bus Services</title>
</head>
<body>
    <a href="../../index.html" style="position:fixed;top:14px;left:14px;z-index:99999;font:12px/1 -apple-system,'Segoe UI',sans-serif;letter-spacing:.04em;text-transform:uppercase;background:#0B0D0E;color:#ECE6D9;padding:8px 12px;border:1px solid #E2661F;text-decoration:none;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.35);">&#8592; Portfolio</a>

    <div class="leaflet-top leaflet-left title-background">
        <div class="title-box">
            <div class="map-title">Access to RIPTA Bus Services</div>
        </div>
    </div>

    <div id="infoPanel" class="leaflet-bottom leaflet-right">
        <h2 style="text-align: center;">Info</h2>
        <p class="text-center hidden-xs">Proportion of each Census Block Group within a quarter-mile walkshed of a RIPTA bus stop.</p>
        <p class="text-center hidden-xs">Click a Census Block Group to view coverage details.</p>
        <p class="text-center hidden-xs">Source: RIGIS &amp; RIPTA GTFS</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data/temp_1.js"></script>
    <script>
    var map = L.map('map', {
        attributionControl: false,
        zoomControl: true,
        maxZoom: 20,
        minZoom: 8
    }).fitBounds([[41.62725504299344, -71.70772345325715], [41.918731230698384, -70.9929990396566]]);

    var baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener noreferrer">CARTO</a>',
        opacity: 1.0
    }).addTo(map);

    function getFillColor(pct) {
        if (pct <= 0.1) return 'rgba(252,251,253,0.5019607843137255)';
        if (pct <= 0.2) return 'rgba(241,239,247,0.5019607843137255)';
        if (pct <= 0.3) return 'rgba(224,224,238,0.5019607843137255)';
        if (pct <= 0.4) return 'rgba(201,202,227,0.5019607843137255)';
        if (pct <= 0.5) return 'rgba(176,175,212,0.5019607843137255)';
        if (pct <= 0.6) return 'rgba(150,146,196,0.5019607843137255)';
        if (pct <= 0.7) return 'rgba(124,118,182,0.5019607843137255)';
        if (pct <= 0.8) return 'rgba(102,73,159,0.5019607843137255)';
        if (pct <= 0.9) return 'rgba(85,42,145,0.5019607843137255)';
        return 'rgba(63,0,125,0.5019607843137255)';
    }

    function pop_temp_1(feature, layer) {
        var raw = feature && feature.properties ? feature.properties['percent'] : null;
        var pctText = raw !== null && !isNaN(Number(raw)) ? String(Math.round(Number(raw) * 100)) + '%' : '';
        var popupContent = '<table><tr><th scope="row">Percent:</th><td>' + pctText + '</td></tr></table>';
        layer.bindPopup(popupContent, {maxHeight: 400});
    }

    function style_temp_1_0(feature) {
        var pct = feature && feature.properties ? Number(feature.properties['percent']) : 0;
        return {
            pane: 'pane_temp_1',
            opacity: 1,
            color: 'rgba(0,0,0,1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 2.0,
            fill: true,
            fillOpacity: 1,
            fillColor: getFillColor(pct)
        };
    }

    map.createPane('pane_temp_1');
    map.getPane('pane_temp_1').style.zIndex = 401;
    map.getPane('pane_temp_1').style['mix-blend-mode'] = 'normal';

    var layer_temp_1 = L.geoJson(json_temp_1, {
        pane: 'pane_temp_1',
        onEachFeature: pop_temp_1,
        style: style_temp_1_0
    }).addTo(map);

    L.control.attribution({position: 'bottomleft'}).addTo(map);

    var legendHtml = 'Walkshed coverage<br /><table>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0000100.png" alt="" /></td><td> 0 - 10% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0100201.png" alt="" /></td><td> 10 - 20% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0200302.png" alt="" /></td><td> 20 - 30% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0300403.png" alt="" /></td><td> 30 - 40% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0400504.png" alt="" /></td><td> 40 - 50% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0500605.png" alt="" /></td><td> 50 - 60% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0600706.png" alt="" /></td><td> 60 - 70% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0700807.png" alt="" /></td><td> 70 - 80% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0800908.png" alt="" /></td><td> 80 - 90% </td></tr>' +
        '<tr><td style="text-align: center;"><img src="legend/temp_1_0901009.png" alt="" /></td><td> 90 - 100% </td></tr>' +
        '</table>';

    var overlays = {};
    overlays[legendHtml] = layer_temp_1;
    L.control.layers({}, overlays, {collapsed: false}).addTo(map);
    </script>
</body>
</html>
